<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC by Luis</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <!-- HEADER -->
    <header>
        <h1 class="title">Calculadora de IMC</h1>
    </header>

    <!-- NAV -->
    <nav>
        <a href="https://luishumberto.netlify.app" target="_blank">Site desenvolvido por Luis Humberto</a>
    </nav>

    <!-- MAIN -->
    <main>
        <div class="form">
            <label for="peso">Digite seu peso (em kg)</label><br>
            <input type="number" id="weight" name="weight">
            <br>
            <br>
            <br>
            <label for="altura">Digite sua altura (em metros)</label><br>
            <input type="number" id="height" name="height">
            <br>
            <br>
            <button onclick="clickedButton()">Calcular</button>
            <br>
            <br>
            <p class="imcText"></p>
            <p></p>
        </div>
    </main>

    <!-- FOOTER -->
    <footer>
        
    </footer>
</body>
</html>
